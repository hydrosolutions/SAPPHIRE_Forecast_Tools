name: Test & push production branch to DockerHub

env:
  IMAGE_TAG: latest

  BASE_IMAGE_NAME: mabesa/sapphire-pythonbaseimage
  PIPELINE_IMAGE_NAME: mabesa/sapphire-pipeline
  DASHBOARD_IMAGE_NAME: mabesa/sapphire-dashboard
  CONFIG_IMAGE_NAME: mabesa/sapphire-configuration
  PREPQ_IMAGE_NAME: mabesa/sapphire-preprunoff
  PREPG_IMAGE_NAME: mabesa/sapphire-prepgateway
  LINREG_IMAGE_NAME: mabesa/sapphire-linreg
  ML_IMAGE_NAME: mabesa/sapphire-ml
  LT_IMAGE_NAME: mabesa/sapphire-lt-forecasting
  POSTPQ_IMAGE_NAME: mabesa/sapphire-postprocessing
  CONCMOD_IMAGE_NAME: mabesa/sapphire-conceptmod

on:
  push:
    branches: [ "maxat_sapphire_2" ]
  #pull_request:
  #  branches: [ "main" ]

jobs:

  # Test iEasyHydroForecast with Python 3.12 + uv + pytest
  test_ieasyhydroforecast_py312:
    runs-on: ubuntu-latest
    name: Test iEasyHydroForecast (Python 3.12 + uv)

    steps:
    - name: Checkout the commit that triggered the workflow
      uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"

    - name: Set up Python 3.12 with uv
      run: uv python install 3.12

    - name: Install dependencies with uv
      working-directory: ./apps/iEasyHydroForecast
      run: |
        uv sync --all-extras

    - name: Test with pytest
      working-directory: ./apps
      run: |
        SAPPHIRE_TEST_ENV=True iEasyHydroForecast/.venv/bin/python -m pytest iEasyHydroForecast/tests/ -v

  # Build and push Python 3.12 + uv base image
  build_and_push_base_image:
    needs: [test_ieasyhydroforecast_py312]
    runs-on: ubuntu-latest
    name: Build and push Python 3.12 + uv base image

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Docker registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # PRE-PUSH GATE (step 1/3): build single-arch amd64 and LOAD it into the local daemon
      # (push:false, load:true) so the image can be smoke-tested before publishing. Reuses the
      # gha cache; cache-to seeds it so the push build below is a cache hit. load => single platform.
      - name: Build base image for smoke-test (load, amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/docker_base_image/Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: ${{ env.BASE_IMAGE_NAME }}:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # PRE-PUSH GATE (step 2/3): runtime smoke-test the loaded image. This would have caught the
      # 2026-07-01 upstream regression (bash needing GLIBC_2.38 on a glibc-2.36 base, crash-looping
      # every container) BEFORE any broken :latest reached Docker Hub. Any error fails the job.
      - name: Smoke-test base image (pre-push gate)
        run: |
          echo "Verifying Python version..."
          docker run --rm "${{ env.BASE_IMAGE_NAME }}:smoke-test" python --version
          echo "Verifying uv is available..."
          docker run --rm "${{ env.BASE_IMAGE_NAME }}:smoke-test" uv --version
          echo "Runtime smoke-test: bash runs without glibc/linker errors..."
          docker run --rm "${{ env.BASE_IMAGE_NAME }}:smoke-test" bash -lc 'echo SMOKE_OK'
          echo "Runtime smoke-test: python + libc loader (uv itself covered by 'uv --version' above)..."
          docker run --rm "${{ env.BASE_IMAGE_NAME }}:smoke-test" python -c "print('PY_OK')"
          # Note: base image only provides Python + uv. Packages are installed by child images via uv sync.

      # PRE-PUSH GATE (step 3/3): only reached if the smoke-test passed. Publishes the real image
      # with SLSA provenance + SBOM (fast gha cache hit from the test build; same single-arch bits).
      - name: Build and push Docker image with attestation
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/docker_base_image/Dockerfile
          push: true
          tags: ${{ env.BASE_IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          # Enable SLSA provenance attestation
          provenance: true
          sbom: true
          # Use cache for faster builds
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # Test pipeline with Python 3.12 + uv
  test_pipeline_py312:
    runs-on: ubuntu-latest
    name: Test pipeline (Python 3.12 + uv)
    steps:
      - name: Check out the current branch
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install pipeline dependencies
        working-directory: ./apps/pipeline
        run: uv sync --all-extras

      - name: Verify imports
        working-directory: ./apps
        run: |
          pipeline/.venv/bin/python -c "import luigi; import docker; import yaml; import requests; import tenacity; from dotenv import load_dotenv; print('All imports successful!'); print(f'luigi: {luigi.__version__}'); print(f'docker: {docker.__version__}')"

  # Build and push pipeline image
