name: Monthly Security Rebuild

# Rebuilds all Docker images from fresh upstream to pick up security fixes
# Runs monthly or on-demand via manual trigger
# Uses Python 3.12 + uv workflow (aligned with deploy_production.yml)

on:
  schedule:
    # Run at 00:00 UTC on first day of every month
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      skip_module_rebuild:
        description: 'Rebuild only base image (skip module images)'
        type: boolean
        default: false

env:
  # Image names (same as deploy_main.yml)
  BASE_IMAGE_NAME: mabesa/sapphire-pythonbaseimage
  PIPELINE_IMAGE_NAME: mabesa/sapphire-pipeline
  DASHBOARD_IMAGE_NAME: mabesa/sapphire-dashboard
  PREPQ_IMAGE_NAME: mabesa/sapphire-preprunoff
  PREPG_IMAGE_NAME: mabesa/sapphire-prepgateway
  LINREG_IMAGE_NAME: mabesa/sapphire-linreg
  ML_IMAGE_NAME: mabesa/sapphire-ml
  LT_IMAGE_NAME: mabesa/sapphire-lt-forecasting
  POSTPQ_IMAGE_NAME: mabesa/sapphire-postprocessing
  # Deprecated/disabled images (kept for reference):
  # RERUN_IMAGE_NAME: mabesa/sapphire-rerun  # reset_forecast_run_date deprecated
  # CONCMOD_IMAGE_NAME: mabesa/sapphire-conceptmod  # R-based, builds broken

jobs:
  # Calculate monthly tag (e.g., 2025-03)
  setup:
    runs-on: ubuntu-latest
    outputs:
      monthly_tag: ${{ steps.calc.outputs.monthly_tag }}
    steps:
      - name: Calculate monthly tag
        id: calc
        run: |
          MONTHLY_TAG="$(date +%Y-%m)"
          echo "monthly_tag=${MONTHLY_TAG}" >> $GITHUB_OUTPUT
          echo "Monthly tag: ${MONTHLY_TAG}"

  # Test iEasyHydroForecast with Python 3.12 + uv before building base image
  test-base-image:
    needs: setup
    runs-on: ubuntu-latest
    name: Test iEasyHydroForecast (Python 3.12 + uv)

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python 3.12 with uv
        run: uv python install 3.12

      - name: Install dependencies with uv
        working-directory: ./apps/iEasyHydroForecast
        run: |
          uv sync --all-extras

      - name: Test with pytest
        working-directory: ./apps
        run: |
          SAPPHIRE_TEST_ENV=True iEasyHydroForecast/.venv/bin/python -m pytest iEasyHydroForecast/tests/ -v

  # Build and push base image from fresh upstream with attestation
  rebuild-base-image:
    needs: [setup, test-base-image]
    runs-on: ubuntu-latest
    name: Rebuild base image from fresh upstream

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # PRE-PUSH GATE (step 1/3): build a single-arch amd64 image and LOAD it into the local
      # daemon (push:false, load:true) so it can be smoke-tested before anything is published.
      # pull:true + no-cache:true preserves the monthly fresh-upstream security intent;
      # cache-to warms the gha cache so the push build below is a fast cache hit (identical bits)
      # rather than a second full rebuild. load requires a single platform (amd64).
      - name: Build base image for smoke-test (load, amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/docker_base_image/Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: ${{ env.BASE_IMAGE_NAME }}:smoke-test
          # Pull fresh base image to get security patches
          pull: true
          # Disable cache to ensure fresh build with latest packages
          no-cache: true
          # Seed the gha cache so the push build below is a cache hit
          cache-to: type=gha,mode=max

      # PRE-PUSH GATE (step 2/3): runtime smoke-test the loaded image. This would have caught the
      # 2026-07-01 upstream regression (a fresh python:3.12-slim-bookworm base shipped a bash binary
      # requiring GLIBC_2.38 on a glibc-2.36 image, crash-looping every container) BEFORE any broken
      # :latest reached Docker Hub. Any error here fails the job and blocks the push below.
      - name: Smoke-test base image (pre-push gate)
        run: |
          echo "Verifying Python version..."
          docker run --rm "${{ env.BASE_IMAGE_NAME }}:smoke-test" python --version
          echo "Verifying uv is available..."
          docker run --rm "${{ env.BASE_IMAGE_NAME }}:smoke-test" uv --version
          echo "Runtime smoke-test: bash runs without glibc/linker errors..."
          docker run --rm "${{ env.BASE_IMAGE_NAME }}:smoke-test" bash -lc 'echo SMOKE_OK'
          echo "Runtime smoke-test: python + libc loader (uv itself covered by 'uv --version' above)..."
          docker run --rm "${{ env.BASE_IMAGE_NAME }}:smoke-test" python -c "print('PY_OK')"

      # PRE-PUSH GATE (step 3/3): only reached if the smoke-test passed. Publishes the real
      # multi-tag image with SLSA provenance + SBOM. The warm gha cache from the test build makes
      # this a fast cache hit producing the same bits that were just tested (single-arch amd64,
      # same as before this change).
      - name: Build and push base image with attestation
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/docker_base_image/Dockerfile
          push: true
          tags: |
            ${{ env.BASE_IMAGE_NAME }}:latest
            ${{ env.BASE_IMAGE_NAME }}:${{ needs.setup.outputs.monthly_tag }}
          cache-from: type=gha
          # Enable SLSA provenance attestation
          provenance: true
          sbom: true

      - name: Confirm base image published
        run: |
          echo "Pushed ${{ env.BASE_IMAGE_NAME }}:latest"
          echo "Pushed ${{ env.BASE_IMAGE_NAME }}:${{ needs.setup.outputs.monthly_tag }}"

  # Rebuild all module images (only if not skipped)
  # Using matrix strategy with docker/build-push-action@v7

  rebuild-pipeline:
    needs: [setup, rebuild-base-image]
    if: ${{ github.event.inputs.skip_module_rebuild != 'true' }}
    runs-on: ubuntu-latest
    name: Rebuild pipeline

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push with attestation
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/pipeline/Dockerfile
          push: true
          tags: |
            ${{ env.PIPELINE_IMAGE_NAME }}:latest
            ${{ env.PIPELINE_IMAGE_NAME }}:${{ needs.setup.outputs.monthly_tag }}
          pull: true
          no-cache: true
          provenance: true
          sbom: true

  rebuild-dashboard:
    needs: [setup, rebuild-base-image]
    if: ${{ github.event.inputs.skip_module_rebuild != 'true' }}
    runs-on: ubuntu-latest
    name: Rebuild forecast dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # PRE-PUSH GATE (step 1/3): build single-arch amd64 and LOAD locally for smoke-testing
      # before publishing. pull:true + no-cache:true keeps the monthly fresh-upstream intent;
      # cache-to seeds the gha cache so the push build below is a cache hit. load => single platform.
      - name: Build dashboard image for smoke-test (load, amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/forecast_dashboard/Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: ${{ env.DASHBOARD_IMAGE_NAME }}:smoke-test
          pull: true
          no-cache: true
          cache-to: type=gha,mode=max

      # PRE-PUSH GATE (step 2/3): runtime smoke-test the loaded dashboard image. Fails the job
      # (blocking the push below) on any glibc/loader break like the 2026-07-01 crash-loop regression.
      - name: Smoke-test dashboard image (pre-push gate)
        run: |
          echo "Runtime smoke-test: bash runs without glibc/linker errors..."
          docker run --rm "${{ env.DASHBOARD_IMAGE_NAME }}:smoke-test" bash -lc 'echo SMOKE_OK'
          echo "Runtime smoke-test: uv + python + libc loader..."
          docker run --rm "${{ env.DASHBOARD_IMAGE_NAME }}:smoke-test" uv run python -c "print('PY_OK')"
          # NOTE: we intentionally do NOT start `panel serve` here. The dashboard CMD initializes
          # against runtime env/API/DB that CI does not provision, so a detached-startup check would
          # be flaky (false negatives on missing env, not image defects). The bash + `uv run python`
          # loader checks fully cover the 2026-07-01 glibc/loader crash-loop class; a full
          # panel-serve health gate needs provisioned runtime env and is deferred.

      # PRE-PUSH GATE (step 3/3): only reached if the smoke-test passed. Publishes the real
      # multi-tag image with provenance + SBOM (fast gha cache hit from the test build above).
      - name: Build and push with attestation
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/forecast_dashboard/Dockerfile
          push: true
          tags: |
            ${{ env.DASHBOARD_IMAGE_NAME }}:latest
            ${{ env.DASHBOARD_IMAGE_NAME }}:${{ needs.setup.outputs.monthly_tag }}
          cache-from: type=gha
          provenance: true
          sbom: true

  rebuild-preprunoff:
    needs: [setup, rebuild-base-image]
    if: ${{ github.event.inputs.skip_module_rebuild != 'true' }}
    runs-on: ubuntu-latest
    name: Rebuild preprocessing runoff

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push with attestation
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/preprocessing_runoff/Dockerfile
          push: true
          tags: |
            ${{ env.PREPQ_IMAGE_NAME }}:latest
            ${{ env.PREPQ_IMAGE_NAME }}:${{ needs.setup.outputs.monthly_tag }}
          pull: true
          no-cache: true
          provenance: true
          sbom: true

  rebuild-prepgateway:
    needs: [setup, rebuild-base-image]
    if: ${{ github.event.inputs.skip_module_rebuild != 'true' }}
    runs-on: ubuntu-latest
    name: Rebuild preprocessing gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push with attestation
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/preprocessing_gateway/Dockerfile
          push: true
          tags: |
            ${{ env.PREPG_IMAGE_NAME }}:latest
            ${{ env.PREPG_IMAGE_NAME }}:${{ needs.setup.outputs.monthly_tag }}
          pull: true
          no-cache: true
          provenance: true
          sbom: true

  rebuild-linreg:
    needs: [setup, rebuild-base-image]
    if: ${{ github.event.inputs.skip_module_rebuild != 'true' }}
    runs-on: ubuntu-latest
    name: Rebuild linear regression

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push with attestation
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/linear_regression/Dockerfile
          push: true
          tags: |
            ${{ env.LINREG_IMAGE_NAME }}:latest
            ${{ env.LINREG_IMAGE_NAME }}:${{ needs.setup.outputs.monthly_tag }}
          pull: true
          no-cache: true
          provenance: true
          sbom: true

  rebuild-ml:
    needs: [setup, rebuild-base-image]
    if: ${{ github.event.inputs.skip_module_rebuild != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60  # ML image is large, needs more time
    name: Rebuild machine learning

    steps:
      # Free disk space for large ML image (PyTorch/Darts)
      - name: Free disk space
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android
          echo "Disk space after cleanup:"
          df -h

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push with attestation
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/machine_learning/Dockerfile
          push: true
          tags: |
            ${{ env.ML_IMAGE_NAME }}:latest
            ${{ env.ML_IMAGE_NAME }}:${{ needs.setup.outputs.monthly_tag }}
          pull: true
          no-cache: true
          provenance: true
          sbom: true

  rebuild-lt-forecasting:
    needs: [setup, rebuild-base-image]
    if: ${{ github.event.inputs.skip_module_rebuild != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: Rebuild long-term forecasting

    steps:
      # Free disk space for large LT image (PyTorch + catboost/lightgbm/xgboost)
      - name: Free disk space
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android
          echo "Disk space after cleanup:"
          df -h

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push with attestation
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/long_term_forecasting/Dockerfile
          push: true
          tags: |
            ${{ env.LT_IMAGE_NAME }}:latest
            ${{ env.LT_IMAGE_NAME }}:${{ needs.setup.outputs.monthly_tag }}
          pull: true
          no-cache: true
          provenance: true
          sbom: true

  rebuild-postprocessing:
    needs: [setup, rebuild-base-image]
    if: ${{ github.event.inputs.skip_module_rebuild != 'true' }}
    runs-on: ubuntu-latest
    name: Rebuild postprocessing forecasts

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push with attestation
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/postprocessing_forecasts/Dockerfile
          push: true
          tags: |
            ${{ env.POSTPQ_IMAGE_NAME }}:latest
            ${{ env.POSTPQ_IMAGE_NAME }}:${{ needs.setup.outputs.monthly_tag }}
          pull: true
          no-cache: true
          provenance: true
          sbom: true

  # DISABLED: reset_forecast_run_date is deprecated
  # DISABLED: conceptual_model is R-based with broken dependencies

  # Generate summary
  summarize:
    needs:
      - setup
      - rebuild-base-image
      - rebuild-pipeline
      - rebuild-dashboard
      - rebuild-preprunoff
      - rebuild-prepgateway
      - rebuild-linreg
      - rebuild-ml
      - rebuild-lt-forecasting
      - rebuild-postprocessing
    if: always()
    runs-on: ubuntu-latest
    name: Generate rebuild summary

    steps:
      - name: Generate summary
        run: |
          echo "# Monthly Security Rebuild Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Monthly Tag:** ${{ needs.setup.outputs.monthly_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Build Configuration" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Python version:** 3.12" >> $GITHUB_STEP_SUMMARY
          echo "- **Package manager:** uv" >> $GITHUB_STEP_SUMMARY
          echo "- **Dockerfile:** Dockerfile" >> $GITHUB_STEP_SUMMARY
          echo "- **Fresh upstream:** yes (--pull --no-cache)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Security Features" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All images built with:" >> $GITHUB_STEP_SUMMARY
          echo "- SLSA provenance attestation" >> $GITHUB_STEP_SUMMARY
          echo "- SBOM (Software Bill of Materials)" >> $GITHUB_STEP_SUMMARY
          echo "- Fresh upstream base images (security patches)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Images Rebuilt" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | :latest | :${{ needs.setup.outputs.monthly_tag }} |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|---------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| ${{ env.BASE_IMAGE_NAME }} | ✅ | ✅ |" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ github.event.inputs.skip_module_rebuild }}" != "true" ]]; then
            echo "| ${{ env.PIPELINE_IMAGE_NAME }} | ✅ | ✅ |" >> $GITHUB_STEP_SUMMARY
            echo "| ${{ env.DASHBOARD_IMAGE_NAME }} | ✅ | ✅ |" >> $GITHUB_STEP_SUMMARY
            echo "| ${{ env.PREPQ_IMAGE_NAME }} | ✅ | ✅ |" >> $GITHUB_STEP_SUMMARY
            echo "| ${{ env.PREPG_IMAGE_NAME }} | ✅ | ✅ |" >> $GITHUB_STEP_SUMMARY
            echo "| ${{ env.LINREG_IMAGE_NAME }} | ✅ | ✅ |" >> $GITHUB_STEP_SUMMARY
            echo "| ${{ env.ML_IMAGE_NAME }} | ✅ | ✅ |" >> $GITHUB_STEP_SUMMARY
            echo "| ${{ env.LT_IMAGE_NAME }} | ✅ | ✅ |" >> $GITHUB_STEP_SUMMARY
            echo "| ${{ env.POSTPQ_IMAGE_NAME }} | ✅ | ✅ |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Reproducibility" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To pin to this month's images, use:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`dockerfile" >> $GITHUB_STEP_SUMMARY
          echo "FROM mabesa/sapphire-pythonbaseimage:${{ needs.setup.outputs.monthly_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
