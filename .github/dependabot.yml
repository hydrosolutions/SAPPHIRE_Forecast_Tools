version: 2
updates:
  # --- Active app modules (uv + pyproject.toml) ---
  - package-ecosystem: "pip"
    directory: "/apps/iEasyHydroForecast"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      python-deps:
        update-types: ["minor", "patch"]

