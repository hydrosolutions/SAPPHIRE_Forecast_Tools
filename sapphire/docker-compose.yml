services:
  # ============== DATABASES ==============
#  task-db:
#    image: postgres:15
#    container_name: sapphire-task-db
#    environment:
#      POSTGRES_USER: postgres
#      POSTGRES_PASSWORD: password
#      POSTGRES_DB: task_db
#    ports:
#      - "5432:5432"
#    volumes:
#      - task-data:/var/lib/postgresql/data
#    healthcheck:
#      test: ["CMD-SHELL", "pg_isready -U postgres"]
#      interval: 10s
#      timeout: 5s
#      retries: 5
#    networks:
#      - sapphire-network
#    restart: unless-stopped

  preprocessing-db:
    image: postgres:15
    container_name: sapphire-preprocessing-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${PREPROCESSING_DB}
    ports:
      - "5433:5432"
    volumes:
      - preprocessing-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sapphire-network
    restart: unless-stopped

  postprocessing-db:
    image: postgres:15
    container_name: sapphire-postprocessing-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTPROCESSING_DB}
    ports:
      - "5434:5432"
    volumes:
      - postprocessing-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sapphire-network
    restart: unless-stopped

  user-db:
    image: postgres:15
    container_name: sapphire-user-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${USER_DB}
    ports:
      - "5435:5432"
    volumes:
      - user-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sapphire-network
    restart: unless-stopped

  auth-db:
    image: postgres:15
    container_name: sapphire-auth-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${AUTH_DB}
    ports:
      - "5436:5432"
    volumes:
      - auth-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sapphire-network
    restart: unless-stopped

  # ============== SERVICES ==============
  api-gateway:
    build:
      context: .
      dockerfile: ./services/api-gateway/Dockerfile
    container_name: sapphire-api-gateway
    ports:
      - "8000:8000"
    depends_on:
      - preprocessing-api
      - postprocessing-api
      - user-api
    environment:
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT}
      HEALTH_CHECK_TIMEOUT: ${HEALTH_CHECK_TIMEOUT}
      API_KEY_ENABLED: ${API_KEY_ENABLED}
      API_KEY: ${API_KEY}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED}
      RATE_LIMIT: ${RATE_LIMIT}
      PREPROCESSING_API_URL: ${PREPROCESSING_API_URL}
      POSTPROCESSING_API_URL: ${POSTPROCESSING_API_URL}
      USER_API_URL: ${USER_API_URL}
      AUTH_API_URL: ${AUTH_API_URL}
    networks:
      - sapphire-network
    restart: unless-stopped
    # For development: mount code as volume
    volumes:
      - ./services/api-gateway:/code

#  task-api:
#    build:
#      context: .
#      dockerfile: ./services/task-service/Dockerfile
#    container_name: sapphire-task-api
#    ports:
#      - "8001:8001"
#    depends_on:
#      task-db:
#        condition: service_healthy
#    environment:
#      DATABASE_URL: postgresql://postgres:password@task-db:5432/task_db
#      TEST_DATABASE_URL: postgresql://postgres:password@task-db:5432/task_db_test
#      PYTHONPATH: /code
#      LOG_LEVEL: INFO
#    networks:
#      - sapphire-network
#    restart: unless-stopped
#    # For development: mount code as volume
#    volumes:
#      - ./services/task-service:/code

  preprocessing-api:
    build:
      context: .
      dockerfile: ./services/preprocessing/Dockerfile
    container_name: sapphire-preprocessing-api
    ports:
      - "8002:8002"
    depends_on:
      preprocessing-db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${PREPROCESSING_DATABASE_URL}
      LOG_LEVEL: ${LOG_LEVEL}
      API_BASE_URL: ${PREPROCESSING_API_URL}
      BATCH_SIZE: ${BATCH_SIZE}
      CSV_FOLDER: ${CSV_FOLDER}
      PYTHONPATH: /code
    networks:
      - sapphire-network
    restart: unless-stopped
    # For development: mount code as volume
    volumes:
      - ./services/preprocessing:/code
      - ${INTERMEDIATE_DATA_PATH}:/intermediate_data

  postprocessing-api:
    build:
      context: .
      dockerfile: ./services/postprocessing/Dockerfile
    container_name: sapphire-postprocessing-api
    ports:
      - "8003:8003"
    depends_on:
      postprocessing-db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${POSTPROCESSING_DATABASE_URL}
      LOG_LEVEL: ${LOG_LEVEL}
      API_BASE_URL: ${POSTPROCESSING_API_URL}
      BATCH_SIZE: ${BATCH_SIZE}
      CSV_FOLDER: ${CSV_FOLDER}
      PYTHONPATH: /code
    networks:
      - sapphire-network
    restart: unless-stopped
    # For development: mount code as volume
    volumes:
      - ./services/postprocessing:/code
      - ${INTERMEDIATE_DATA_PATH}:/intermediate_data
      - ${DATA_PATH}/config:/config

  user-api:
    build:
      context: .
      dockerfile: ./services/user/Dockerfile
    container_name: sapphire-user-api
    ports:
      - "8004:8004"
    depends_on:
      user-db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${USER_DATABASE_URL}
      LOG_LEVEL: ${LOG_LEVEL}
    networks:
      - sapphire-network
    restart: unless-stopped
    volumes:
      - ./services/user:/code

  auth-api:
    build:
      context: .
      dockerfile: ./services/auth/Dockerfile
    container_name: sapphire-auth-api
    ports:
      - "8005:8005"
    depends_on:
      auth-db:
        condition: service_healthy
      user-api:
        condition: service_started
    environment:
      DATABASE_URL: ${AUTH_DATABASE_URL}
      USER_SERVICE_URL: ${USER_API_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS}
      LOG_LEVEL: ${LOG_LEVEL}
    networks:
      - sapphire-network
    restart: unless-stopped
    volumes:
      - ./services/auth:/code

  dashboard:
    image: mabesa/sapphire-dashboard:${ieasyhydroforecast_frontend_docker_image_tag:-latest}
    build:
      context: ../
      dockerfile: ./apps/forecast_dashboard/Dockerfile
    container_name: sapphire-dashboard
    working_dir: /app/apps/forecast_dashboard
    init: true
    environment:
      - PYTHONPATH=/app
      - ieasyhydroforecast_data_root_dir=${ieasyhydroforecast_data_root_dir}
      - ieasyhydroforecast_container_data_ref_dir=${ieasyhydroforecast_container_data_ref_dir}
      - SAPPHIRE_OPDEV_ENV=True
      - IN_DOCKER_CONTAINER=True
      - ieasyhydroforecast_env_file_path=${ieasyhydroforecast_env_file_path}
      - ieasyhydroforecast_url_pentad=${ieasyhydroforecast_url_pentad}
      - ALLOWED_WEBSOCKET_ORIGINS=${ieasyhydroforecast_url_pentad}
      - sapphire_forecast_horizon=pentad
    command: >
      bash -c "
      ORIGINS_ARGS=$(echo $${ieasyhydroforecast_url_pentad} | sed 's/,/ --allow-websocket-origin=/g' | sed 's/^/--allow-websocket-origin=/') &&
      panel serve
      --address=0.0.0.0
      --port=5006
      $${ORIGINS_ARGS}
      forecast_dashboard.py
      --num-threads=4
      "
    restart: always
    ports:
      - "5006:5006"
    volumes:
      - ${ieasyhydroforecast_data_ref_dir}/config:${ieasyhydroforecast_container_data_ref_dir}/config
      - ${ieasyhydroforecast_data_ref_dir}/intermediate_data:${ieasyhydroforecast_container_data_ref_dir}/intermediate_data
      - ${ieasyhydroforecast_data_ref_dir}/templates:${ieasyhydroforecast_container_data_ref_dir}/templates
      - ${ieasyhydroforecast_data_ref_dir}/reports:${ieasyhydroforecast_container_data_ref_dir}/reports
      - ${ieasyhydroforecast_data_ref_dir}/bin:${ieasyhydroforecast_container_data_ref_dir}/bin
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - com.centurylinklabs.watchtower.enable=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5006/forecast_dashboard"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  task-data:
  preprocessing-data:
  postprocessing-data:
  user-data:
  auth-data:

networks:
  sapphire-network:
    driver: bridge
