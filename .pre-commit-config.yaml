repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: run-integration-tests
        name: Run integration tests
        # Integration tests are skipped by default. Set TEST_LOCAL=true to run local tests.
        # Usage: TEST_LOCAL=true git commit -m "message"
        entry: bash -c 'if [ "${TEST_LOCAL}" = "true" ]; then cd apps/forecast_dashboard && uv run pytest tests/test_integration.py -v; fi'
        language: system
        types: [python]
        pass_filenames: false

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
        # NOTE: scope narrowed to migration-toolkit files only (v2 R5 carve-out).
        # Legacy bin/ scripts have 55 pre-existing findings, tracked in
        # doc/plans/issues/high_prio_gi_draft_infra_legacy_bin_shellcheck_cleanup.md.
        # Broaden to ^bin/.*\.sh$ after that cleanup PR lands.
        files: ^bin/(initialize_[a-z0-9_]+_history|export_[a-z0-9_]+_history)\.sh$|^bin/utils/update_migration_helpers\.sh$
        args: ["--external-sources"]
