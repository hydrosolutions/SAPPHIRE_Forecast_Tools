[project]
name = "preprocessing-gateway"
version = "0.1.0"
description = "Preprocessing module for weather data from SAPPHIRE data gateway"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Sandro Hunziker", url = "https://github.com/sandrohuni"},
    {name = "Beatrice Marti", url = "https://github.com/mabesa"},
]
dependencies = [
    # Core data processing
    "pandas>=2.2.2",
    "numpy>=1.26.4,<3.0.0",
    # Scientific computing (for quantile mapping)
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
    # Date/time handling
    "python-dateutil>=2.9.0",
    "pytz>=2024.1",
    # Configuration
    "python-dotenv>=1.0.1",
    # Workflow orchestration
    "luigi>=3.5.0",
    # HTTP client (the transport-retry helper dispatches on requests'
    # exception classes; declared directly rather than relying on it
    # arriving transitively via sapphire-dg-client)
    "requests>=2.32.0",
    # SAPPHIRE Data Gateway client (private repo - requires access)
    "sapphire-dg-client @ git+https://github.com/hydrosolutions/sapphire-dg-client.git@main",
    # SAPPHIRE API client (for writing to preprocessing service)
    "sapphire-api-client @ git+https://github.com/hydrosolutions/sapphire-api-client.git@4fd543e852f1eb0c834d8ab649a849a0a56d4e9b",
    # Local library dependency
    "iEasyHydroForecast",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    # PREPG-020: one test module imports and exercises the real
    # sapphire/services/preprocessing schema + CRUD (SnowBulkCreate,
    # crud.create_snow) against an in-memory SQLite DB, to prove the
    # anti-clobber fix survives the service's real upsert -- not just
    # that the outgoing python dict looks right. Version floors match
    # sapphire/services/preprocessing/requirements.txt. Test-only;
    # nothing under sapphire/services/** is modified.
    "sqlalchemy>=2.0.44",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.11.0",
]

[tool.uv]
# Allow git and local path dependencies
allow-insecure-host = []

[tool.uv.sources]
# Use local iEasyHydroForecast from sibling directory
iEasyHydroForecast = { path = "../iEasyHydroForecast", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
