description = "API data validation for SAPPHIRE forecast pipeline"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
