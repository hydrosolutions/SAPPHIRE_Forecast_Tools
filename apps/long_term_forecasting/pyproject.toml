[project]
name = "long-term-forecasting"
version = "0.1.0"
description = "Long-term (monthly/seasonal) forecasting module for SAPPHIRE forecast tools"
readme = "readme.md"
requires-python = ">=3.11"
authors = [
    {name = "Beatrice Marti", url = "https://github.com/mabesa"},
]
dependencies = [
    # ML frameworks
    "catboost==1.2.10",
    "lightgbm>=4.6.0",
    "xgboost>=3.2.0",
    "scikit-learn>=1.4.0",
    # Deep learning
    "torch>=2.9.0",
    "pytorch-lightning>=2.5.0",
    "torchmetrics>=1.8.0",
    # Statistical models
    "statsmodels>=0.14.5",
    # Hydrological
    "PE-Oudin>=0.3",
    # Core data processing
    "pandas>=2.2.0",
    "numpy>=1.26.4",
    "scipy>=1.15.0",
    # Visualization
    "matplotlib>=3.8.2",
    "seaborn>=0.13.2",
    "plotly>=6.5.0",
    # Optimization
    "optuna>=3.5.0",
    # Data formats
    "pyarrow>=15.0.0",
    # Configuration
    "python-dotenv>=1.2.1",
    "PyYAML>=6.0.3",
    # Database
    "SQLAlchemy>=2.0.40",
    "psycopg2-binary>=2.9.11",
    "alembic>=1.17.0",
    # HTTP
    "requests>=2.32.0",
    "aiohttp>=3.13.4",
    "ieasyhydro-sdk @ git+https://github.com/hydrosolutions/ieasyhydro-python-sdk",
    "sapphire-api-client @ git+https://github.com/hydrosolutions/sapphire-api-client.git@4fd543e852f1eb0c834d8ab649a849a0a56d4e9b",
    # Local library dependency
    "iEasyHydroForecast @ file:///${PROJECT_ROOT}/../iEasyHydroForecast",
    "lt-forecasting",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
]

[tool.uv]
allow-insecure-host = []

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
iEasyHydroForecast = { path = "../iEasyHydroForecast", editable = true }
lt-forecasting = { git = "https://github.com/hydrosolutions/long-term-forecasting.git", rev = "d717d247b3baac0b47a3682debe002b918563c37" }
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
