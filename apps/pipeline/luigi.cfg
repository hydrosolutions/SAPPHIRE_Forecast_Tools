[core]
# Scheduler host/port are passed via command line arguments (--scheduler-host, --scheduler-port)
# in docker-compose-luigi.yml. The %(...)s syntax is ConfigParser interpolation (looks for
# config keys), not environment variable substitution, so it doesn't work as intended.
autoload_range: false

[resources]
# Resource pool limits enforced by the Luigi daemon (luigid).
# Tasks declare per-unit consumption (e.g. resources = {"ml_memory": 1}),
# and the daemon caps total concurrent usage at these values.
# Workers do not read this section — it is only consumed by luigid.
ml_memory = 1
lt_memory = 1

[worker]
check_complete_on_run = true
